<!doctype html>
<meta charset="utf-8">
<title>Verificación</title>
<style>html,body{margin:0;height:100%;background:#fff}iframe{border:0;width:100%;height:100vh;display:block}</style>
<script>
  const p = new URLSearchParams(location.search);
  localStorage.setItem('nodo-reader-prefs', JSON.stringify({ theme: p.get('theme') || 'light', paper: 'on', font: '100' }));
  const f = document.createElement('iframe');
  f.src = './';
  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument;
      const pane = p.get('pane');
      if (pane) d.querySelector(`.side-link[data-pane="${pane}"]`)?.click();
      if (p.get('scroll')) setTimeout(() => f.contentWindow.scrollTo(0, +p.get('scroll')), 400);
    }, 1500);
  });
  document.body.appendChild(f);
</script>
