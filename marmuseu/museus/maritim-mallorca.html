<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museu Marítim de Mallorca | La Mar de Museus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .placeholder-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6rem 1.5rem 3rem;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(26,123,161,0.22), transparent 50%),
        linear-gradient(160deg, #071c2b 0%, #0a2a3d 45%, #06141f 100%);
      color: #FAFAF8;
      text-align: center;
    }
    .placeholder-page h1 {
      font-size: clamp(1.8rem, 1.2rem + 2vw, 3rem);
      margin: 0.4rem 0 0.6rem;
      max-width: 18ch;
      margin-inline: auto;
    }
    .placeholder-page .place {
      color: #D4C5B9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .placeholder-page p {
      color: rgba(250,250,248,0.72);
      max-width: 36ch;
      margin: 1rem auto 1.75rem;
      line-height: 1.65;
    }
    .placeholder-page .btn { margin: 0 0.35rem; }
  </style>
</head>
<body>
  <main class="placeholder-page">
    <div>
      <p class="place">Mallorca</p>
      <h1>Museu Marítim de Mallorca</h1>
      <p>Pàgina en construcció. Aviat aquí hi haurà l’espai propi d’aquest museu dins la xarxa.</p>
      <a class="btn btn-primary" href="../index.html#mapa">Torna al mapa</a>
      <a class="btn btn-secondary" href="../museus.html">Tots els museus</a>
    </div>
  </main>
</body>
</html>
